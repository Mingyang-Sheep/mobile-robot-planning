DWAPlannerROS:
  # Mani keeps the arm stationary for navigation. These limits keep the larger
  # model moving gently while allowing short recovery motions in tight maps.
  max_vel_x: 0.25
  min_vel_x: -0.04

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_trans: 0.25
  min_vel_trans: 0.02

  max_vel_theta: 1.0
  min_vel_theta: 0.05

  acc_lim_x: 0.7
  acc_lim_y: 0.0
  acc_lim_theta: 1.2

  xy_goal_tolerance: 0.18
  yaw_goal_tolerance: 0.30
  latch_xy_goal_tolerance: true

  sim_time: 1.2
  vx_samples: 24
  vy_samples: 0
  vth_samples: 32
  controller_frequency: 10.0

  path_distance_bias: 28.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02
  forward_point_distance: 0.22
  stop_time_buffer: 0.15
  scaling_speed: 0.20
  max_scaling_factor: 0.20

  oscillation_reset_dist: 0.05

  publish_traj_pc: true
  publish_cost_grid_pc: true
