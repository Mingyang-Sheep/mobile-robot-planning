DWAPlannerROS:
  # WPB Home simulation uses a diff-drive adapter around the official model.
  # These limits are conservative starting values for the larger base.
  max_vel_x: 0.30
  min_vel_x: -0.05

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_trans: 0.30
  min_vel_trans: 0.02

  max_vel_theta: 0.8
  min_vel_theta: 0.1

  acc_lim_x: 0.8
  acc_lim_y: 0.0
  acc_lim_theta: 1.5

  xy_goal_tolerance: 0.18
  yaw_goal_tolerance: 0.25
  latch_xy_goal_tolerance: false

  sim_time: 1.2
  vx_samples: 18
  vy_samples: 0
  vth_samples: 32
  controller_frequency: 5.0

  path_distance_bias: 20.0
  goal_distance_bias: 14.0
  occdist_scale: 0.06
  forward_point_distance: 0.35
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.05

  publish_traj_pc: true
  publish_cost_grid_pc: true
