DWAPlannerROS:
  # WPB Home simulation uses a diff-drive adapter around the official model.
  # These limits are conservative starting values for the larger base.
  max_vel_x: 0.30
  min_vel_x: 0.0

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_trans: 0.30
  min_vel_trans: 0.08

  max_vel_theta: 1.2
  min_vel_theta: 0.25

  acc_lim_x: 0.8
  acc_lim_y: 0.0
  acc_lim_theta: 1.5

  xy_goal_tolerance: 0.18
  yaw_goal_tolerance: 0.25
  latch_xy_goal_tolerance: false

  sim_time: 1.8
  vx_samples: 20
  vy_samples: 0
  vth_samples: 24
  controller_frequency: 10.0

  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.03
  forward_point_distance: 0.35
  stop_time_buffer: 0.25
  scaling_speed: 0.25
  max_scaling_factor: 0.25

  oscillation_reset_dist: 0.08

  publish_traj_pc: true
  publish_cost_grid_pc: true
