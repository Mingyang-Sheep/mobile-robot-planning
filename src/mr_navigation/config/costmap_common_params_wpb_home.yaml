# WPB Home base diameter is about 0.45m in the official collision model
# (body_link cylinder radius 0.226m). This rectangular footprint is a safe
# first approximation for navigation and should be refined with real clearance
# tests in each world.

footprint: [[-0.240, -0.250], [-0.240, 0.250], [0.260, 0.250], [0.260, -0.250]]


observation_sources: scan
scan:
  sensor_frame: laser
  data_type: LaserScan
  topic: /scan
  marking: true
  clearing: true

obstacle_layer:
  obstacle_range: 10.0
  raytrace_range: 10.5
  observation_sources: scan
  scan:
    sensor_frame: laser
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true

inflation_layer:
  inflation_radius: 0.38
  cost_scaling_factor: 4.0
