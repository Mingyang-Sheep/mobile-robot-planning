DWAPlannerROS:
  # Go2W 轮腿模型先使用低速上限，避免 RL 策略在迷宫中被过激速度命令带乱。
  max_vel_x: 0.65
  # 起步阶段禁用倒车，先让全局路径跟踪更可控。
  min_vel_x: 0.16

  # Go2W 先按前进 + 偏航方式联调，稳定后再逐步打开侧向速度。
  max_vel_y: 0.0
  min_vel_y: 0.0

  # 平动速度上限与 Go2W 保守联调速度保持一致。
  max_vel_trans: 0.65
  # 保留低速逼近能力，减少终点附近抖动。
  min_vel_trans: 0.16

  # 角速度先压到温和范围，后续可根据仿真稳定性继续上调。
  max_vel_theta: 1.0
  min_vel_theta: 0.18

  # 起停加速度保持保守，降低策略输入突变。
  acc_lim_x: 0.9
  acc_lim_y: 0.0
  acc_lim_theta: 1.4

  # Go2W 足迹更大，目标容差略放宽以提升迷宫收敛稳定性。
  xy_goal_tolerance: 0.22
  yaw_goal_tolerance: 3.14159
  # 不锁存位置容差，允许姿态修正阶段继续细化位置误差。
  latch_xy_goal_tolerance: true

  # 前向模拟时间保留 1.5s，兼顾前瞻性与局部规划实时性。
  sim_time: 1.5
  # 线速度采样数覆盖低速到保守上限。
  vx_samples: 20
  # 暂不采样侧移，先稳定完成迷宫导航闭环。
  vy_samples: 0
  vth_samples: 20
  # 控制频率设为 10Hz，与局部代价地图刷新频率保持一致。
  controller_frequency: 10.0

  # 路径偏置设为 32.0，优先跟随全局路径，减少局部规划随意抄近路。
  path_distance_bias: 32.0
  # 目标偏置设为 24.0，略高于旧值，使机器人在临近终点时更积极收敛。
  goal_distance_bias: 24.0
  # 障碍代价权重设为 0.02，保持避障敏感度但不过度保守。
  occdist_scale: 0.08
  # 前瞻点评分距离保持 0.325，维持对前向可行轨迹的偏好。
  forward_point_distance: 0.325
  # 停车时间缓冲保持 0.2s，避免高频控制下误选来不及刹停的轨迹。
  stop_time_buffer: 0.2
  # 接近障碍时适度缩放 footprint，避免迷宫墙角擦碰。
  scaling_speed: 0.2
  # 最大缩放因子保持 0.2，避免障碍附近 footprint 扩张过大导致过度保守。
  max_scaling_factor: 0.2

  # 摆动复位距离设为 5cm，小底盘轻微脱困后即可恢复正常评分。
  oscillation_reset_dist: 0.05

  # 发布候选轨迹点云，便于后续多底盘调参时可视化对比。
  publish_traj_pc: true
  # 发布代价栅格点云，便于观察参数调整对局部代价场的影响。
  publish_cost_grid_pc: true
