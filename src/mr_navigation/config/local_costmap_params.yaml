local_costmap:
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  # 局部代价地图固定在里程计坐标系下，适合随车滚动更新。
  global_frame: odom
  # 机器人底盘参考系统一为 base_footprint，便于多底盘共用导航接口。
  robot_base_frame: base_footprint

  # 局部地图更新频率降到 5Hz，兼顾避障响应和仿真负载。
  update_frequency: 5.0
  # 发布频率降到 2Hz，减少 RViz/costmap 发布开销。
  publish_frequency: 2.0
  # TF 容差保持 0.5s，吸收仿真/通信中的轻微时间抖动。
  transform_tolerance: 0.5

  # 开启 rolling window，形成真正随车移动的局部环境感知窗口。
  rolling_window: true
  # 局部窗口宽度设为 3m，兼顾窄场景机动和前方障碍预判。
  width: 3.0
  # 局部窗口高度设为 3m，与宽度对称，保证转向时前后左右视野均衡。
  height: 3.0
  # 分辨率保持 5cm，与地图和激光精度对齐，减少重采样误差。
  resolution: 0.05
