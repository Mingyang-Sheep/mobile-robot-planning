DWAPlannerROS:
  # Waffle Pi 共用 Waffle 差速底盘能力，方便只比较传感器/算法组合差异。
  max_vel_x: 0.26
  min_vel_x: 0.0

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_trans: 0.26
  min_vel_trans: 0.02

  max_vel_theta: 1.82
  min_vel_theta: 0.10

  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 2.0

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.2
  latch_xy_goal_tolerance: false

  sim_time: 1.2
  vx_samples: 18
  vy_samples: 0
  vth_samples: 34
  controller_frequency: 5.0

  path_distance_bias: 22.0
  goal_distance_bias: 16.0
  occdist_scale: 0.05
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.05

  publish_traj_pc: true
  publish_cost_grid_pc: true
