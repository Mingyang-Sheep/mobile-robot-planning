DWAPlannerROS:
  # Waffle 官方线速度上限约为 0.26m/s，差速约束与 Burger 保持同一接口。
  max_vel_x: 0.26
  min_vel_x: 0.0

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_trans: 0.26
  min_vel_trans: 0.08

  max_vel_theta: 1.82
  min_vel_theta: 0.4

  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 2.0

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.2
  latch_xy_goal_tolerance: false

  sim_time: 1.5
  vx_samples: 20
  vy_samples: 0
  vth_samples: 20
  controller_frequency: 10.0

  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.05

  publish_traj_pc: true
  publish_cost_grid_pc: true
