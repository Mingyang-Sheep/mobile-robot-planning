# WPB Home Mani uses the same mobile base as WPB Home, but the upper arm
# makes the simulated scan/costmap tighter in narrow worlds. Keep navigation
# footprint focused on the base, then refine against real clearance tests.
obstacle_range: 3.0
raytrace_range: 3.5

footprint: [[-0.200, -0.210], [-0.200, 0.210], [0.230, 0.210], [0.230, -0.210]]
robot_radius: 0.23

inflation_radius: 0.22
cost_scaling_factor: 5.0

observation_sources: scan
scan:
  sensor_frame: laser
  data_type: LaserScan
  topic: /scan
  marking: true
  clearing: true

obstacle_layer:
  obstacle_range: 3.0
  raytrace_range: 3.5
  observation_sources: scan
  scan:
    sensor_frame: laser
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true

inflation_layer:
  inflation_radius: 0.22
  cost_scaling_factor: 5.0
